# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

# - resources:
#     cpu: true
#     memory: true
#     disk: /
#     cputemp: true
#     tempmin: 0 # optional, minimum cpu temp
#     tempmax: 100 # optional, maximum cpu temp
#     uptime: true
#     units: metric # only used by cpu temp, options: 'imperial' or 'metric'
#     refresh: 3000 # optional, in ms
#     diskUnits: bytes # optional, bytes (default) or bbytes. Only applies to disk
#     network: true # optional, uses 'default' if true or specify a network interface name
- glances:
    url: http://192.168.178.11:61208
    version: 4 # required only if running glances v4 or higher, defaults to 3
    cpu: true # optional, enabled by default, disable by setting to false
    mem: true # optional, enabled by default, disable by setting to false
    cputemp: true # disabled by default
    cpuSensorLabel: Package id # optional additional cputemp sensor label prefix
    unit: metric # optional for temp, default is metric
    uptime: true # disabled by default
    disk: / # disabled by default, use mount point of disk(s) in glances. Can also be a list (see below)
    diskUnits: bytes # optional, bytes (default) or bbytes. Only applies to disk
    expanded: true # show the expanded view
    label: Io # optional
- glances:
    url: http://192.168.178.22:61208
    version: 4 # required only if running glances v4 or higher, defaults to 3
    cpu: true # optional, enabled by default, disable by setting to false
    mem: true # optional, enabled by default, disable by setting to false
    cputemp: true # disabled by default
    cpuSensorLabel: Package id # optional additional cputemp sensor label prefix
    unit: metric # optional for temp, default is metric
    uptime: true # disabled by default
    disk: / # disabled by default, use mount point of disk(s) in glances. Can also be a list (see below)
    diskUnits: bytes # optional, bytes (default) or bbytes. Only applies to disk
    expanded: true # show the expanded view
    label: Jupiter # optional

- search:
    provider: duckduckgo
    target: _blank

- datetime:
    text_size: xl
    locale: de
    format:
      dateStyle: short
      timeStyle: short
      hourCycle: h23
